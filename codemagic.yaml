workflows:
  ios-testflight:
    name: Truco Uruguayo - iPhone TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: truco-apple
    environment:
      node: 22
      vars:
        TRUCO_ADS_MODE: "off"
      xcode: latest
      groups:
        - truco_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.matiasmoranc.truco
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Verificar el juego
        script: npm test
      - name: Preparar el juego y generar iOS
        script: |
          set -e
          npm run mobile:build
          npm run mobile:verify:no-ads
          npx cap add ios
          npx cap sync ios
          node scripts/build-app-icons.cjs
          node scripts/prepare-no-ads.cjs
      - name: Configurar Firebase, Google y Apple
        script: python3 scripts/prepare-ios.py
      - name: Aplicar certificados y perfiles
        script: xcode-project use-profiles
      - name: Compilar la version de prueba
        script: |
          set -e
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  android-play:
    name: Truco Uruguayo - Android Google Play (AAB)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      vars:
        TRUCO_ADS_MODE: "off"
      java: 21
      groups:
        - truco_android
      android_signing:
        - truco_android_upload
    scripts:
      - name: Instalar dependencias y verificar el juego
        script: |
          set -e
          npm ci
          npm test
      - name: Preparar Android
        script: |
          set -e
          npm run mobile:build
          npm run mobile:verify:no-ads
          npx cap add android
          npx cap sync android
          npm run mobile:icons
          node scripts/prepare-no-ads.cjs
      - name: Configurar Firebase y firma de distribucion
        script: |
          set -e
          node scripts/prepare-android-release.cjs
          cd android
          ./gradlew signingReport
      - name: Generar el paquete para Google Play
        script: |
          set -e
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
