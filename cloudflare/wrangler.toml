name = "truco-live"
main = "src/index.js"
compatibility_date = "2025-09-01"
# The shared referee modules use node:crypto (randomInt, scrypt, timingSafeEqual).
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "truco-6553d"
FIREBASE_DATABASE_URL = "https://truco-6553d-default-rtdb.firebaseio.com"
# Where credits live: "firebase" (creditEconomy in Realtime Database) or "bank" (Bank Durable Object).
CREDITS_BACKEND = "bank"
# Browser origins allowed to open sockets. Native apps send capacitor:// or https://localhost.
# Who may enter the BAR while it is tried (comma-separated uids; now Alejo and Nahuelcas); administrators always can.
# Who can walk behind the counter in the BAR (bar-core.js barStaff): only the owner's account, Mati93.
BAR_STAFF = "4E51mttuGza69selOHip9U3CfGF3"
BAR_ALLOW = "XYniLjLwfHcizLAYEBL5tuxQhMo2,q2IVvTWWD3e4iC0L11ltKhmpL5U2,5aWBQgWBhIUuZlXD18m22Cf1i3v2,FlwOoFpE3vezgqH2S6gvf2pqohp2,c6lUSrTqDtbAZTYy4mBRwey97to2"
# The BAR open to everyone with an account (at most 50 at once). "0" closes it again (then only BAR_ALLOW).
BAR_OPEN = "1"
ALLOWED_ORIGINS = "https://trucouruguayo.uy,https://matiasmoranc.github.io,https://truco-6553d.web.app,https://truco-6553d.firebaseapp.com,capacitor://localhost,https://localhost"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   FIREBASE_SERVICE_ACCOUNT  JSON key of a service account with Realtime Database access
#   INTERNAL_SECRET           shared secret for Cloud Functions -> Worker admin calls

[[durable_objects.bindings]]
name = "TABLES"
class_name = "TableRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "BANK"
class_name = "Bank"

[[durable_objects.bindings]]
name = "BAR"
class_name = "Bar"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableRoom", "Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Bank"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Bar"]
