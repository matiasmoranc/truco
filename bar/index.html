<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1712">
<title>BAR · Truco Uruguayo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3cf73;--ink:#f1e6c8;--panel:#0d1f17;--line:rgba(243,207,115,.45);--muted:#a9bbb0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1712;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:3}
.pill{pointer-events:auto;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 14px "DM Sans",sans-serif;text-decoration:none;white-space:nowrap}
.pill.count{margin-left:auto;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.zoom{position:fixed;right:10px;bottom:calc(90px + env(safe-area-inset-bottom));display:flex;flex-direction:column;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.zoom button{width:46px;height:46px;border:0;background:transparent;color:var(--ink);font:700 26px "DM Sans",sans-serif;cursor:pointer}
.zoom button+button{border-top:1px solid #29473a}
.status{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:rgba(6,14,10,.92);padding:20px}
.status[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:360px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.card h2{margin:0 0 8px;color:var(--gold);font-size:22px}
.card p{margin:0 0 14px;color:#cfd8d1;line-height:1.4}
.btn{display:inline-block;border:0;border-radius:999px;padding:11px 18px;font:800 15px "DM Sans",sans-serif;background:var(--gold);color:#2a1a0e;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 20px));z-index:5;background:rgba(13,31,23,.96);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.sheet[hidden]{display:none}
.sheet h3{margin:0 0 4px;color:var(--gold);font-size:17px}
.sheet .sub{margin:0 0 12px;color:#cfd8d1;font-size:14px}
.board-cols{max-height:52vh;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 10px}
.board-cols h4{margin:0 0 6px;color:var(--gold);font-size:13px}
.board-list{margin:0;padding:0 0 0 18px;font-size:13px;color:#eef3ee}
.board-list li{padding:2px 0}
.board-list li span{display:inline-block;max-width:calc(100% - 44px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.board-list b{float:right;color:#ffe3a0}
@media (max-width:520px){.board-cols{grid-template-columns:1fr}}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.points{display:flex;gap:6px;margin:0 0 12px}
.points button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 0;font:700 14px "DM Sans",sans-serif;cursor:pointer}
.points button[aria-pressed=true]{background:var(--gold);color:#2a1a0e}
.chat{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:min(380px,calc(100% - 76px));z-index:4;background:rgba(13,31,23,.94);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.chat[hidden]{display:none}
.chat header{padding:8px 12px;font-size:12.5px;color:var(--gold);font-weight:700;border-bottom:1px solid #29473a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat ol{list-style:none;margin:0;padding:8px 12px;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-size:14px;touch-action:pan-y}
.chat li b{color:var(--gold);font-weight:700}
.chat li.me b{color:#9fd3ff}
.chat li.note{color:var(--muted);font-size:12.5px}
.chat form{display:flex;border-top:1px solid #29473a}
.chat input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);padding:11px 12px;font:15px "DM Sans",sans-serif;outline:none;user-select:text}
.chat button{border:0;background:var(--gold);color:#2a1a0e;font:800 14px "DM Sans",sans-serif;padding:0 14px;cursor:pointer}
.toast{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:8;background:#3b2a10;color:#ffe1a0;border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:14px;max-width:calc(100% - 30px);text-align:center}
.toast[hidden]{display:none}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top));z-index:2;color:#cfd8d1;font-size:13px;background:rgba(13,31,23,.8);border-radius:999px;padding:6px 12px;pointer-events:none;white-space:nowrap}
.labels{position:fixed!important;inset:0;pointer-events:none;z-index:1}
.tag{display:flex;align-items:center;gap:5px;background:rgba(15,42,31,.9);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:2px 9px 2px 3px;font:700 12px "DM Sans",sans-serif;white-space:nowrap}
.tag img{width:20px;height:20px;border-radius:50%;object-fit:cover;background:#f1e6c8}
.tag.me{background:#173a52;border-color:#9fd3ff}
.tag.mozo{padding:2px 9px;background:#f4f1ea;color:#1a1a1a}
.sign{border-radius:999px;padding:4px 12px;font:800 13px "DM Sans",sans-serif;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sign.free{background:rgba(13,31,23,.92);color:var(--gold);border:1px solid var(--line)}
.sign.score,.sign.wait{background:var(--gold);color:#2a1a0e}
.call{background:#fff6dc;color:#8a2b2b;font:900 16px "DM Sans",sans-serif;padding:6px 12px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.bubble{background:#fff6dc;color:#2a1a0e;font:700 14px "DM Sans",sans-serif;padding:7px 11px;border-radius:12px;max-width:220px;white-space:normal;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.call[hidden],.bubble[hidden]{display:none}
.zoom,.top,.chat,.sheet,.toast,.status,.hint,.stick{z-index:6}
/* A long press on a phone never selects text or opens the copy menu; only the boxes you type in do. */
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default}
.stick{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(13,31,23,.55);border:2px solid rgba(243,207,115,.45);touch-action:none;box-shadow:inset 0 0 24px rgba(0,0,0,.45)}
.stick-knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a8,#d7a948);box-shadow:0 6px 16px rgba(0,0,0,.5);pointer-events:none;transition:transform .08s}
.chat{left:auto!important;right:10px;width:min(360px,calc(100% - 175px))!important}
.zoom{bottom:auto!important;top:calc(70px + env(safe-area-inset-top))}
.top{flex-wrap:nowrap}.top button.pill{cursor:pointer}
.emotes{position:fixed;right:10px;top:calc(176px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;z-index:6}
.emotes button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:22px;line-height:1;cursor:pointer;padding:0}
.emotes button:active{transform:scale(.92)}
.emote-list{display:flex;flex-direction:column;gap:6px}.emote-list[hidden]{display:none}
#emote-toggle[aria-expanded=true]{background:var(--gold);color:#2a1a0e;font-size:18px;font-weight:800}
.sign-report{pointer-events:auto;cursor:pointer;border:1px solid rgba(243,207,115,.7);border-radius:999px;padding:6px 13px;background:rgba(13,31,23,.92);color:#f1e6c8;font:700 12.5px "DM Sans",sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.4);white-space:nowrap}
.sheet-x{position:absolute;top:10px;right:12px;border:0;background:transparent;color:var(--ink);font:700 18px "DM Sans",sans-serif;cursor:pointer}
.problem-form textarea{width:100%;resize:none;border-radius:12px;border:1px solid var(--line);background:#0a1812;color:var(--ink);padding:10px 12px;font:15px "DM Sans",sans-serif;margin:0 0 12px;user-select:text}
.btn.full{width:100%}.problem-status{margin:10px 0 0;color:#cfd8d1;font-size:13px;min-height:1px}
.near-action{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));z-index:6;cursor:pointer;font-size:15px;padding:11px 18px;background:var(--gold);color:#2a1a0e;border-color:var(--gold)}
.near-action[hidden]{display:none}
/* Watching a game from above: what players say and shout, bigger. */
.watch-score{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:6;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);padding:8px 14px;border-radius:14px;background:rgba(13,31,23,.92);border:1px solid var(--line);color:#f1e6c8;font:700 14px "DM Sans",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none}
.watch-score[hidden]{display:none}.watch-score span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30vw}.watch-score b{font-size:22px;color:var(--gold)}.watch-score i{font-style:normal;opacity:.6}.watch-score small{color:#a9b8ad;font-size:12px;margin-left:4px}
body.watching .bubble{font-size:17px;max-width:280px;padding:8px 13px}body.watching .bubble.talk{font-size:18px}body.watching .bubble.shout{font-size:21px}body.watching .call{font-size:20px}
body.sheet-open .near-action,body.sheet-open .counter-actions{display:none!important}
/* With the chat open, the buttons at the bottom go up above it. */
body.with-chat .near-action,body.with-chat .counter-actions{bottom:calc(150px + env(safe-area-inset-bottom))}
.counter-actions{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px}
.counter-actions[hidden],.counter-actions [hidden]{display:none}
.counter-actions .pill{cursor:pointer;font-size:15px;padding:11px 18px}
.counter-actions .order{background:var(--gold);color:#2a1a0e;border-color:var(--gold)}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.menu button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:8px 2px;font:700 12px "DM Sans",sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.menu button span{font-size:24px}
body.editing .emotes,body.editing .chat,body.editing .chat-open,body.editing .stick,body.editing .zoom,body.editing .counter-actions,body.editing .near-action,body.editing .hint,body.editing .net{display:none!important}
body.editing .count{visibility:hidden}
.bubble.talk{font-size:15px}.bubble.shout{background:#fff1c9;color:#8a2b2b;font-weight:900;font-size:17px;letter-spacing:.02em}
.bubble.emote{font-size:30px;background:transparent;box-shadow:none;padding:0}
.arm-pick{pointer-events:auto;background:rgba(13,31,23,.96);border:1px solid var(--gold);border-radius:14px;padding:10px;text-align:center;color:var(--ink);font:13px "DM Sans",sans-serif;box-shadow:0 10px 28px rgba(0,0,0,.5);width:236px}
.arm-pick b{color:var(--gold);display:block;margin-bottom:6px}
.arm-pick .pts,.arm-pick .go{display:flex;gap:5px}.arm-pick .pts{margin-bottom:8px}
.arm-pick button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:7px 0;font:700 13px "DM Sans",sans-serif;cursor:pointer}
.arm-pick button[aria-pressed=true],.arm-pick .main{background:var(--gold);color:#2a1a0e}
.net{position:fixed;left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top));z-index:7;background:#3b2a10;color:#ffe1a0;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.net[hidden]{display:none}
.net button{border:0;background:transparent;color:var(--gold);font:800 13px "DM Sans",sans-serif;cursor:pointer}
.chat header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat header span{overflow:hidden;text-overflow:ellipsis}
.chat header button{border:0;background:transparent;color:var(--ink);font:700 14px "DM Sans",sans-serif;cursor:pointer;padding:0 2px}
.chat li.mention{background:rgba(243,207,115,.18);border-radius:6px;padding:2px 4px}
.chat-open{position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;cursor:pointer;font-size:16px}
.chat-open[hidden]{display:none}
.look-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.look-head h3{margin:0}
.look-tools{display:flex;gap:6px}.look-tools button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;min-width:36px;height:34px;padding:0 10px;font:700 14px "DM Sans",sans-serif;cursor:pointer}
.look-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#0a1812;border:1px solid #29473a;border-radius:12px;padding:3px;margin-bottom:10px}
.look-tabs button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 0;font:700 13px "DM Sans",sans-serif;cursor:pointer}
.look-tabs button[aria-selected=true]{background:var(--gold);color:#2a1a0e}
.look-ed{max-height:30vh;min-height:120px;overflow:auto;margin-bottom:10px;touch-action:pan-y;padding-right:2px}
.grp{margin-bottom:10px}.grp>span{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 11px;font:700 13px "DM Sans",sans-serif;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--gold);color:#2a1a0e}
.chips .sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.chips .sw[aria-pressed=true]{border:3px solid #fff;box-shadow:0 0 0 2px var(--gold)}
@media (max-width:420px){.top .pill{padding:7px 10px;font-size:13px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="scene" aria-label="El bar con las mesas de truco"></canvas>
<div class="top"><a class="pill" href="/">← Lobby</a><button class="pill" id="me-look" type="button">Mi muñeco</button></div>
<div class="hint" id="hint">Arrastrá para mirar · joystick para caminar · tocá una mesa para sentarte</div>
<div class="stick" id="stick" aria-label="Joystick para caminar"><div class="stick-knob" id="stick-knob"></div></div>
<div class="zoom"><button id="zoom-in" aria-label="Acercar">+</button><button id="zoom-out" aria-label="Alejar">−</button></div>
<section class="chat" id="chat" hidden aria-label="Chat con los que están cerca">
 <header><span id="chat-who">Cerca</span><button id="chat-close" type="button" aria-label="Cerrar el chat">✕</button></header>
 <ol id="chat-log"></ol>
 <form id="chat-form" autocomplete="off"><input id="chat-input" maxlength="140" placeholder="Escribí a los que están cerca…" enterkeyhint="send"><button>Enviar</button></form>
</section>
<section class="sheet" id="sheet" hidden></section>
<button class="pill chat-open" id="chat-open" type="button" hidden aria-label="Abrir el chat">💬</button>
<div class="emotes" aria-label="Gestos"><button type="button" id="emote-toggle" aria-expanded="false" aria-label="Gestos">👋</button><div id="emote-list" class="emote-list" hidden><button type="button" data-g="wave" aria-label="Saludar">👋</button><button type="button" data-g="clap" aria-label="Aplaudir">👏</button><button type="button" data-g="cheers" aria-label="Brindar">🍻</button><button type="button" data-g="party" aria-label="Festejar">🎉</button></div></div>
<button class="pill near-action" id="report-near" type="button" hidden>⚠️ Reportar problema</button><button class="pill near-action" id="ask-table" type="button" hidden>🍽️ Pedir una mesa</button><button class="pill near-action" id="watch" type="button" hidden>👀 Mirar la partida</button><div id="watch-score" class="watch-score" hidden></div>
<div class="counter-actions" id="counter" hidden><button class="pill order" id="order" type="button">🍽️ Pedir</button><button class="pill leave" id="leave" type="button" hidden>✋ Dejar</button></div>
<div class="net" id="net" hidden><span id="net-text"></span></div>
<div class="net" id="wait" hidden><span id="wait-text"></span><button id="wait-cancel" type="button">Cancelar</button></div>
<div class="toast" id="toast" hidden></div>
<div class="status" id="status"><div class="card"><h2>BAR</h2><p id="status-text">Entrando al bar…</p><div id="status-actions"></div></div></div>
<script type="module" src="/bar3d/bar3d.js?v=20261121-3d41"></script>
</body>
</html>
