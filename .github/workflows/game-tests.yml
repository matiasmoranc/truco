name: Game regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          cp app.js /tmp/truco-app.mjs
          node --check /tmp/truco-app.mjs
      - name: Verify shared server rules
        run: |
          node scripts/build-credit-referee.cjs
          git diff --exit-code -- functions/game-referee.cjs
      - name: Play regression scenarios
        run: node --test tests/*.cjs
  credit-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install server dependencies
        run: npm ci --prefix functions
      - name: Verify credit rules and server in isolated Firebase emulator
        run: npx --yes firebase-tools@13 emulators:exec --only database --project demo-truco --config firebase.emulators.json "node scripts/test-credit-rules.cjs && node scripts/test-credit-functions.cjs"

